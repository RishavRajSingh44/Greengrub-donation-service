spring.application.name=donation-service
server.port=8083

# Kafka Producer
spring.kafka.producer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9002}
donation.kafka.topic=donation-topic

# gRPC Server
grpc.server.port=${DONATION_GRPC_SERVER_PORT:9093}

# gRPC Clients
# food-service (batch food hydration for donation detail page)
grpc.client.food-service.address=static://${FOOD_SERVICE_HOST:localhost}:${FOOD_GRPC_SERVICE_PORT:9091}
grpc.client.food-service.negotiation-type=plaintext

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

#  Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.theme=monokai

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# Resilience4j -- Kafka
# Retry (3 attempts: 500ms -> 1s -> 2s)
resilience4j.retry.instances.kafkaPublishRetry.max-attempts=3
resilience4j.retry.instances.kafkaPublishRetry.wait-duration=500ms
resilience4j.retry.instances.kafkaPublishRetry.enable-exponential-backoff=true
resilience4j.retry.instances.kafkaPublishRetry.exponential-backoff-multiplier=2
resilience4j.retry.instances.kafkaPublishRetry.retry-exceptions=com.greengrub.donationService.exception.KafkaPublishException

# Circuit breaker (opens after 50 % failures in 10-call window, waits 30s)
resilience4j.circuitbreaker.instances.kafkaPublishBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.kafkaPublishBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.kafkaPublishBreaker.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.kafkaPublishBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.kafkaPublishBreaker.register-health-indicator=true
resilience4j.circuitbreaker.instances.kafkaPublishBreaker.automatic-transition-from-open-to-half-open-enabled=true

# Resilience4j - Database
# Retry reads only - writes are NOT retried (save/delete are not idempotent)
resilience4j.retry.instances.dbRetry.max-attempts=3
resilience4j.retry.instances.dbRetry.wait-duration=200ms
resilience4j.retry.instances.dbRetry.enable-exponential-backoff=true
resilience4j.retry.instances.dbRetry.exponential-backoff-multiplier=2
resilience4j.retry.instances.dbRetry.retry-exceptions=org.springframework.dao.TransientDataAccessException

resilience4j.circuitbreaker.instances.dbBreaker.register-health-indicator=true
resilience4j.circuitbreaker.instances.dbBreaker.automatic-transition-from-open-to-half-open-enabled=true

# Resilience4j - Food Service
# Retry: 2 attempts - food hydration is a best-effort read enrichment
resilience4j.retry.instances.foodServiceRetry.max-attempts=2
resilience4j.retry.instances.foodServiceRetry.wait-duration=1000ms
resilience4j.retry.instances.foodServiceRetry.enable-exponential-backoff=true
resilience4j.retry.instances.foodServiceRetry.exponential-backoff-multiplier=2
resilience4j.retry.instances.foodServiceRetry.retry-exceptions=com.greengrub.donationService.exception.FoodServiceException

resilience4j.circuitbreaker.instances.foodServiceBreaker.register-health-indicator=true
resilience4j.circuitbreaker.instances.foodServiceBreaker.automatic-transition-from-open-to-half-open-enabled=true
