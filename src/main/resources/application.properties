spring.application.name=donationService
server.port=8083

# Kafka Producer
spring.kafka.producer.bootstrap-servers=localhost:9092

donation.kafka.topic=donation-topic

# gRPC server
grpc.server.port=9090

# Resilience4j — Kafka producer retry (3 attempts: 500ms → 1s → 2s)
resilience4j.retry.instances.kafkaPublishRetry.max-attempts=3
resilience4j.retry.instances.kafkaPublishRetry.wait-duration=500ms
resilience4j.retry.instances.kafkaPublishRetry.enable-exponential-backoff=true
resilience4j.retry.instances.kafkaPublishRetry.exponential-backoff-multiplier=2
resilience4j.retry.instances.kafkaPublishRetry.retry-exceptions=com.greengrub.donationService.exception.KafkaPublishException

# Resilience4j — Kafka circuit breaker (opens after 50% failures in 10-call window)
resilience4j.circuitbreaker.instances.kafkaPublishBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.kafkaPublishBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.kafkaPublishBreaker.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.kafkaPublishBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.kafkaPublishBreaker.register-health-indicator=true
resilience4j.circuitbreaker.instances.kafkaPublishBreaker.automatic-transition-from-open-to-half-open-enabled=true

# Resilience4j — DB retry (transient Postgres errors only, 2 attempts)
resilience4j.retry.instances.dbOperationRetry.max-attempts=2
resilience4j.retry.instances.dbOperationRetry.wait-duration=200ms
resilience4j.retry.instances.dbOperationRetry.retry-exceptions=org.springframework.dao.TransientDataAccessException
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
