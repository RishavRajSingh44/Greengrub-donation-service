# ──────────────────────── Direct JDBC (Cloud SQL public IP) ──────────────────
spring:
  cloud:
    gcp:
      sql:
        enabled: false   # Cloud SQL auto-config disabled; using direct JDBC URL

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 300000
      max-lifetime: 1200000

  # ──────────────────────── JPA / Hibernate ─────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # ──────────────────────── Kafka ───────────────────────────────
  kafka:
    producer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

# ──────────────────────── gRPC Server ───────────────────────────
grpc:
  server:
    port: ${DONATION_GRPC_SERVER_PORT:9093}
  # ──────────────────────── gRPC Clients ────────────────────────
  client:
    food-service:
      address: static://${FOOD_SERVICE_HOST:food-service}:${FOOD_GRPC_SERVICE_PORT:9091}
      negotiation-type: plaintext

# ──────────────────────── CORS ──────────────────────────────────
# Empty default = no CORS headers; API Gateway is the only legitimate caller in k8s
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# ──────────────────────── Resilience4j — Database (k8s) ─────────
resilience4j:
  retry:
    instances:
      dbRetry:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.dao.TransientDataAccessException
  circuitbreaker:
    instances:
      dbBreaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
        automatic-transition-from-open-to-half-open-enabled: true
      # ──────────────────────── Food Service (k8s) ────────────────
      foodServiceBreaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
        automatic-transition-from-open-to-half-open-enabled: true

logging:
  level:
    root: INFO
    com.greengrub: DEBUG          # or INFO in production
    org.springframework: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

eureka:
  client:
    enabled: false