#  Datasource - local Docker PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/donations
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP - lighter pool for local dev
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate
# validate: Flyway owns the schema; Hibernate only checks it matches entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# CORS
# React dev servers - CRA :3000, Vite :5173
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5773


#Disable cloud infra locally
eureka.client.enabled=true
spring.cloud.gcp.sql.enabled=false
spring.autoconfigure.exclude=com.google.cloud.spring.autoconfigure.sql.GcpCloudSqlAutoConfiguration

# Flyway - use a separate history table so it doesn't conflict with user-service
spring.flyway.table=flyway_schema_history_donation
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Resilience4j - Database (local)
resilience4j.circuitbreaker.instances.dbBreaker.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.dbBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.dbBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.dbBreaker.permitted-number-of-calls-in-half-open-state=2

# Resilience4j - Food Service (local)
resilience4j.circuitbreaker.instances.foodServiceBreaker.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.foodServiceBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.foodServiceBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.foodServiceBreaker.permitted-number-of-calls-in-half-open-state=2

# Logging - verbose for local dev (logback-spring.xml handles appenders + Logstash)
logging.level.root=INFO
logging.level.com.greengrub.donationService=DEBUG
logging.level.org.hibernate.SQL=DEBUG
