spring.application.name=donation-service-test
server.port=0

# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway for tests (H2 DDL handles schema)
spring.flyway.enabled=false

# Disable Cloud SQL auto-config
spring.cloud.gcp.sql.enabled=false

# Kafka — disabled for unit tests (mocked per test)
spring.kafka.producer.bootstrap-servers=localhost:9092
donation.kafka.topic=donation-topic

# gRPC server off in tests
grpc.server.port=-1

# gRPC client — test stubs override this
grpc.client.food-service.address=static://localhost:9191
grpc.client.food-service.negotiation-type=plaintext

# Resilience4j — disable for unit tests to avoid async complexity
resilience4j.retry.instances.kafkaPublishRetry.max-attempts=1
resilience4j.retry.instances.dbRetry.max-attempts=1
resilience4j.retry.instances.foodServiceRetry.max-attempts=1

# Actuator
management.endpoints.web.exposure.include=health
