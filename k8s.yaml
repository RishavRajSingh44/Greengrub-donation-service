# ──────────────────────────────────────────────────────────────────────────────
# Donation Service  –  Deployment + HPA + Service
# Namespace : services
# Resource Plan : CPU req 150m / limit 300m | Mem req 200Mi / limit 450Mi
# HPA : minReplicas 1, maxReplicas 2, CPU 65%, Memory 75%
# NOTE: Running on self-managed kubeadm cluster (not GKE).
#       Cloud SQL is reached via its public IP (SPRING_DATASOURCE_URL).
#       Cloud SQL Auth Proxy sidecar is not used.
#       HPA requires metrics-server to be installed on the cluster.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: donation-service
  namespace: services
  labels:
    app: donation-service
    component: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: donation-service
  template:
    metadata:
      labels:
        app: donation-service
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8083"
        prometheus.io/path:   "/actuator/prometheus"
    spec:
      serviceAccountName: services-sa
      containers:
        - name: donation-service
          image: IMAGE_NAME
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
              name: http
            - containerPort: 9093
              name: grpc
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: donation-service-secret
                  key: SPRING_DATASOURCE_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: donation-service-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: donation-service-secret
                  key: DB_PASSWORD
            # Kafka — read from utility-config-mirror ConfigMap in services namespace
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: utility-config-mirror
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: IMAGE_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: services-config
                  key: IMAGE_SERVICE_HOST
            - name: FOOD_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: services-config
                  key: FOOD_SERVICE_HOST
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: cors-config
                  key: CORS_ALLOWED_ORIGINS
          resources:
            requests:
              cpu:    "50m"
              memory: "200Mi"
            limits:
              cpu:    "300m"
              memory: "450Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
            successThreshold: 1
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 0
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: donation-service-hpa
  namespace: services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: donation-service
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: v1
kind: Service
metadata:
  name: donation-service
  namespace: services
  labels:
    app: donation-service
spec:
  selector:
    app: donation-service
  ports:
    - name: http
      port: 80
      targetPort: 8083
    - name: grpc
      port: 9093
      targetPort: 9093
  type: ClusterIP
